[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "partial-discharge-diagnosis"
version = "0.1.0"
description = "局部放电类型诊断 Python SDK 与桌面应用"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "platformdirs>=4.2,<5",
    "torch>=2.6",
]

[project.urls]
Repository = "https://github.com/int-yu/partial_discharge"
Issues = "https://github.com/int-yu/partial_discharge/issues"

[project.optional-dependencies]
gui = [
    "PySide6>=6.7,<7",
    "matplotlib>=3.9,<4",
]
train = [
    "joblib>=1.4,<2",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "pytest-qt>=4.4,<5",
    "ruff>=0.12,<1",
    "tomli>=2.2,<3; python_version < '3.11'",
]

[project.scripts]
pd-diagnosis = "pd_diagnosis.launcher:main"
pd-migrate-model = "pd_diagnosis.migration:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pd_diagnosis = ["py.typed"]

[tool.setuptools.data-files]
"share/partial-discharge-diagnosis/models/default" = [
    "models/default/manifest.json",
    "models/default/scaler.npz",
    "models/default/weights.pth",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["artifacts", "docs/educate", "legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["src/pd_diagnosis"]
exclude = ["^legacy/", "^docs/"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pd_diagnosis.ui.*"]
ignore_errors = true

[tool.coverage.run]
source = ["pd_diagnosis"]
omit = ["src/pd_diagnosis/experimental/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
